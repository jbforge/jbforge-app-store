port: 8482
description: >-
  Runs the buzz-relay backend for Buzz (https://github.com/block/buzz), a
  self-hostable workspace where humans and AI agents share the same rooms.

  A Buzz community IS its relay: this app stands up the full stack —
  buzz-relay (Rust), Postgres, Redis, MinIO, and a host-aware nginx gateway —
  so your community lives on your own hardware and survives restarts.

  After installing, open the Buzz desktop app, choose "Join an existing
  community", and enter:

  ws://umbrel.local:8482  (or ws://<your-umbrel-ip>:8482)

  Notes:
  • The relay binds its community to one canonical host. By default that is
    the address above. To publish it under a different name (a Tailscale
    MagicDNS name, a domain behind a reverse proxy), set
    APP_JBFORGE_BUZZ_RELAY_URL in app-data/jbforge-buzz-relay/user.env before
    first start — changing it later re-seeds a new, empty community.
  • Requests arriving on any other host are redirected to the canonical URL by
    the bundled gateway, so the Umbrel dashboard tile still lands somewhere
    useful instead of a bare 404.
  • The relay runs in open mode: anyone who can reach the port and holds a
    Nostr key can join. Keep it on your LAN/Tailscale, or enable the pubkey
    allowlist / closed relay mode via env if you expose it.
  • The relay signing key derives from this install's app seed, so the
    community identity is stable across restarts and updates. It can be
    overridden via user.env to carry an existing community onto this install.
  • All data is stored under this app's data directory and is included in
    normal Umbrel app backups.

