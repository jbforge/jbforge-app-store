releaseNotes: >-
  0.2.0: first public release under the JBForge App Store. Continues the
  jacks-buzz-relay 0.1.x lineage (crash-loop fix, static IPs, bundled web UI,
  user.env relay/media URL override, host-aware nginx gateway) under a new app
  id, and adds BUZZ_RELAY_PRIVATE_KEY / BUZZ_GIT_HOOK_HMAC_SECRET overrides in
  user.env so an existing community's identity can be carried onto a new
  install.

  Tracks the ghcr.io/block/buzz:main image (Buzz has no stable release tags
  yet). Restarting the app does not re-pull; update the app to pick up a newer
  relay build.

