version: "3.7"

# Ported from block/buzz deploy/compose/compose.yml for umbrelOS.
# Internal service passwords are hardcoded (official Umbrel app convention —
# postgres/redis/minio are only reachable on this app's private network).
# Secrets that must be stable AND private (relay signing key, git-hook HMAC)
# derive from ${APP_SEED}, Umbrel's deterministic per-install secret, and are
# overridable via app-data/jbforge-buzz-relay/user.env — see exports.sh.

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_JBFORGE_BUZZ_RELAY_GATEWAY_IP}
      APP_PORT: 80
      # No Umbrel login wall: the Buzz desktop app must reach the relay
      # (WebSocket + REST) directly, same as the official nostr-relay app.
      PROXY_AUTH_ADD: "false"

  # Host-aware gateway on :80 (the community relay, reached through Umbrel's
  # app_proxy) and :8081 (the admin dashboard, published on its own host port
  # behind HTTP Basic auth). Config lives in default.conf.template next to this
  # file; NGINX_ENVSUBST_FILTER keeps envsubst off nginx's own runtime $vars.
  gateway:
    image: nginx:1.27-alpine
    restart: on-failure
    environment:
      BUZZ_CANONICAL_HOST: ${APP_JBFORGE_BUZZ_RELAY_CANONICAL_HOST}
      BUZZ_PUBLIC_URL: ${APP_JBFORGE_BUZZ_RELAY_PUBLIC_URL}
      BUZZ_RELAY_UPSTREAM: ${APP_JBFORGE_BUZZ_RELAY_IP}:3000
      BUZZ_RELAY_HEALTH_UPSTREAM: ${APP_JBFORGE_BUZZ_RELAY_IP}:8080
      BUZZ_RELAY_METRICS_UPSTREAM: ${APP_JBFORGE_BUZZ_RELAY_IP}:9102
      BUZZ_ADMIN_HOST: ${APP_JBFORGE_BUZZ_RELAY_ADMIN_HOST}
      BUZZ_ADMIN_PASSWORD: ${APP_JBFORGE_BUZZ_RELAY_ADMIN_PASSWORD}
      # Umbrel's deterministic per-app password, resolved here rather than in
      # exports.sh: umbreld only exports APP_PASSWORD after exports.sh has been
      # sourced (under `set -u`), but it is always set by the time compose
      # interpolates this file. Matches "Show default credentials" in the UI.
      BUZZ_ADMIN_PASSWORD_FALLBACK: ${APP_PASSWORD:-}
      BUZZ_BACKUP_UPSTREAM: ${APP_JBFORGE_BUZZ_RELAY_BACKUP_IP}:8082
      NGINX_ENVSUBST_FILTER: BUZZ_
    # Writes the Basic-auth file, then hands off to the nginx entrypoint.
    # Password precedence: user override (BUZZ_ADMIN_PASSWORD via user.env),
    # then Umbrel's per-app password, then fail closed on a random one nobody
    # holds — that locks the admin port only, :80 keeps serving either way.
    # Kept on one line because Umbrel round-trips this file through YAML and a
    # block scalar can come back folded with its newlines turned into spaces.
    command:
      [
        "/bin/sh",
        "-ec",
        "pw=\"$$BUZZ_ADMIN_PASSWORD\"; [ -n \"$$pw\" ] || pw=\"$$BUZZ_ADMIN_PASSWORD_FALLBACK\"; [ -n \"$$pw\" ] || pw=\"$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \\n')\"; printf 'admin:{PLAIN}%s\\n' \"$$pw\" > /etc/nginx/admin.htpasswd; chmod 644 /etc/nginx/admin.htpasswd; printf 'username: admin\\npassword: %s\\n' \"$$pw\" > /run/buzz-admin/credentials.txt; chmod 644 /run/buzz-admin/credentials.txt; exec /docker-entrypoint.sh nginx -g 'daemon off;'",
      ]
    volumes:
      - ${APP_DATA_DIR}/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${APP_DATA_DIR}/admin:/usr/share/nginx/buzz-admin:ro
      # The admin credential, written 644 so it is readable on the host at
      # app-data/jbforge-buzz-relay/data/admin/credentials.txt without sudo.
      # It is the same value Umbrel already derives for this app from the box
      # seed, so the file is a convenience, not a new secret.
      - ${APP_DATA_DIR}/data/admin:/run/buzz-admin
    ports:
      - "${APP_JBFORGE_BUZZ_RELAY_ADMIN_PORT}:8081"
    networks:
      default:
        ipv4_address: ${APP_JBFORGE_BUZZ_RELAY_GATEWAY_IP}

  # Backup sidecar. Serves one CGI endpoint that streams a tar.gz of the whole
  # relay: a pg_dump of every community, the media objects, the git data, and
  # the signing key. Reachable only through the gateway's Basic-auth'd admin
  # listener — it is never published on a host port.
  #
  # postgres:17-alpine, so pg_dump matches the server major version exactly. Its
  # busybox has tar and gzip but not httpd (Alpine ships that applet in
  # busybox-extras), so the one package is added at start. If the box is offline
  # the loop retries and only the backup endpoint is down; the relay is
  # untouched.
  backup:
    image: postgres:17-alpine
    restart: on-failure
    environment:
      BUZZ_PGHOST: ${APP_JBFORGE_BUZZ_RELAY_POSTGRES_IP}
      BUZZ_PGUSER: buzz
      BUZZ_PGPASSWORD: moneyprintergobrrr
      BUZZ_PGDATABASE: buzz
      BUZZ_RELAY_PRIVATE_KEY: ${APP_JBFORGE_BUZZ_RELAY_PRIVATE_KEY:-${APP_SEED}}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${APP_JBFORGE_BUZZ_RELAY_GIT_HOOK_SECRET:-${APP_SEED}-git-hook}
      BUZZ_RELAY_URL: ${APP_JBFORGE_BUZZ_RELAY_URL}
      BUZZ_RELAY_IMAGE: ghcr.io/block/buzz:main@sha256:80ee929de9584f030286d9d20c9fde724c200665fd36910387668df3764a065c
    # One line on purpose: Umbrel rewrites this compose file through a YAML
    # round-trip, and a multi-line block scalar can come back folded with the
    # newlines turned into spaces.
    entrypoint:
      [
        "/bin/sh",
        "-ec",
        "until apk add --no-cache busybox-extras; do echo 'busybox-extras unavailable (no network?) - retrying in 15s' >&2; sleep 15; done; exec busybox-extras httpd -f -v -p 8082 -h /srv/backup",
      ]
    volumes:
      - ${APP_DATA_DIR}/backup:/srv/backup:ro
      - ${APP_DATA_DIR}/data/minio:/backup-src/minio:ro
      - ${APP_DATA_DIR}/data/git:/backup-src/git:ro
    networks:
      default:
        ipv4_address: ${APP_JBFORGE_BUZZ_RELAY_BACKUP_IP}
    depends_on:
      postgres:
        condition: service_healthy

  # Umbrel creates bind-mount dirs as root; the buzz image runs as uid 1000
  # and needs to write /data/git. Chown once before the relay starts.
  git-dir-init:
    image: busybox:1.36
    command: ["chown", "-R", "1000:1000", "/data/git"]
    volumes:
      - ${APP_DATA_DIR}/data/git:/data/git
    restart: "no"

  relay:
    # Pinned by digest, not by the floating :main tag. Buzz versions the relay
    # separately from the desktop app (`relay-v*` tags — 0.2.0, 10 Jul 2026) and
    # that release predates the desktop 0.5.3 line, so :main is still the right
    # channel; the digest is what makes an app update a reviewable, repeatable
    # change instead of "whatever main built the day you pressed the button".
    # This digest is sha-b1b283c — block/buzz@b1b283cd4, 31 Jul 2026.
    image: ghcr.io/block/buzz:main@sha256:80ee929de9584f030286d9d20c9fde724c200665fd36910387668df3764a065c
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://buzz:moneyprintergobrrr@${APP_JBFORGE_BUZZ_RELAY_POSTGRES_IP}:5432/buzz
      REDIS_URL: redis://:moneyprintergobrrr@${APP_JBFORGE_BUZZ_RELAY_REDIS_IP}:6379
      BUZZ_S3_ENDPOINT: http://${APP_JBFORGE_BUZZ_RELAY_MINIO_IP}:9000
      BUZZ_S3_ACCESS_KEY: buzz-minio
      BUZZ_S3_SECRET_KEY: moneyprintergobrrr
      BUZZ_S3_BUCKET: buzz-media
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: "true"
      BUZZ_SERVE_GIT_WEB_GUI: "true"
      BUZZ_GIT_CONFORMANCE_PROBE: "true"
      # Turns on the relay's admin API and bundled admin SPA, both gated on an
      # exact Host match. The gateway rewrites Host to this value for requests
      # arriving on the admin port and never for community traffic, so the
      # community host cannot reach the admin surface and vice versa.
      BUZZ_ADMIN_HOST: ${APP_JBFORGE_BUZZ_RELAY_ADMIN_HOST}
      BUZZ_RELAY_PRIVATE_KEY: ${APP_JBFORGE_BUZZ_RELAY_PRIVATE_KEY:-${APP_SEED}}
      BUZZ_GIT_HOOK_HMAC_SECRET: ${APP_JBFORGE_BUZZ_RELAY_GIT_HOOK_SECRET:-${APP_SEED}-git-hook}
      RELAY_URL: ${APP_JBFORGE_BUZZ_RELAY_URL}
      BUZZ_MEDIA_BASE_URL: ${APP_JBFORGE_BUZZ_RELAY_MEDIA_URL}
      RUST_LOG: buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info
    volumes:
      - ${APP_DATA_DIR}/data/git:/data/git
    networks:
      default:
        ipv4_address: ${APP_JBFORGE_BUZZ_RELAY_IP}
    depends_on:
      git-dir-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: buzz
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: moneyprintergobrrr
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: ${APP_JBFORGE_BUZZ_RELAY_POSTGRES_IP}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "moneyprintergobrrr"]
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    networks:
      default:
        ipv4_address: ${APP_JBFORGE_BUZZ_RELAY_REDIS_IP}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a moneyprintergobrrr ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: on-failure
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz-minio
      MINIO_ROOT_PASSWORD: moneyprintergobrrr
    volumes:
      - ${APP_DATA_DIR}/data/minio:/data
    networks:
      default:
        ipv4_address: ${APP_JBFORGE_BUZZ_RELAY_MINIO_IP}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://${APP_JBFORGE_BUZZ_RELAY_MINIO_IP}:9000 buzz-minio moneyprintergobrrr
        mc mb --ignore-existing local/buzz-media
        mc anonymous set none local/buzz-media
      '
    restart: "no"
